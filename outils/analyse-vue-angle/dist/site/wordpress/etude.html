/**
 * Racine de recherche des éléments.
 *
 * `document` sur une page servie telle quelle. Collées dans un site existant
 * — une page WordPress, par exemple — les pages vivent dans une racine

 * au chargement plutôt qu'un appel que l'ordre des modules rendrait fragile.

const $$ = (sel) => [...racine.querySelectorAll(sel)];

/** Charge un script à la demande : les gros moteurs ne sont montés qu'au besoin. */
function chargerScript(src) {
  return new Promise((resoudre, rejeter) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resoudre;
    s.onerror = () => rejeter(new Error(`Fichier introuvable : ${src}`));
    document.head.append(s);

/** Mise en forme des nombres à la française, partagée par les modules. */

const arrondir = (v, n = 1) => {
  const f = 10 ** n;
  return Math.round(v * f) / f;
};

/** « 6,4 » plutôt que « 6.4 » : ces valeurs sont lues sur le terrain. */
const fr = (v, n = 1) => String(arrondir(v, n)).replace('.', ',');

/** Idem, avec le signe explicite : un écart se lit « +2,4 » ou « −1,1 ». */
const signe = (v, n = 1) => (v > 0 ? `+${fr(v, n)}` : fr(v, n));

 * Grands nombres avec séparateur de milliers : « 15 552 » se lit d'un coup
 * d'œil, « 15552 » se compte du doigt. L'espace est insécable, pour qu'un
 * retour à la ligne ne coupe pas le nombre en deux.
 */

);

 *
 * Le h aspiré (« de hauteur » ne s'élide pas, « d'habitude » si) n'est pas

 */
const MENU_DEFAUT = {
  marque: { court: 'NGS38', long: 'Sécurité & vidéosurveillance', href: '/' },
  liens: [
    { texte: 'Nos produits', href: '/' },
    { texte: 'Quelle caméra vous faut-il ?', href: '/outils/etude/' },
    { texte: 'Estimer mes caméras', href: '/outils/devis/' },
    { texte: 'Alarme anti-intrusion', href: '/outils/alarme/' },
  ],
  ailleurs: { texte: 'La boutique .com', href: 'https://ngsecurity38.com/' },
};

/**
 * Ramène un chemin à une forme comparable.
 *
 * « /outils/etude », « /outils/etude/ » et « /outils/etude/index.html »
 * désignent la même page : sans cette mise à plat, l'entrée du menu
 * correspondant à la page ouverte ne se reconnaîtrait pas elle-même une fois
 * sur deux, selon la façon dont le serveur a résolu l'adresse.
 */
function memePage(a, b) {
  const plat = (href) => {
    if (!href) return '';
    const sans = String(href).split(/[?#]/)[0].replace(/index\.html?$/i, '');
    return (sans.endsWith('/') ? sans : `${sans}/`).toLowerCase();
  };
  const x = plat(a);
  return !!x && x === plat(b);
}

/**
 * Les entrées à afficher, celle de la page ouverte signalée.
 *
 * Séparée de l'affichage pour être vérifiable sans navigateur : c'est la
 * partie où l'on se trompe.
 */
function entreesMenu(menu, chemin) {
  const m = menu && Array.isArray(menu.liens) && menu.liens.length ? menu : MENU_DEFAUT;
  return m.liens
    .filter((l) => l && l.texte && l.href)
    .map((l) => ({ texte: l.texte, href: l.href, courant: memePage(l.href, chemin) }));
}

/** Le lien vers l'autre domaine, s'il y en a un. */
const lienAilleurs = (menu) => {
  const a = (menu && 'ailleurs' in menu ? menu.ailleurs : MENU_DEFAUT.ailleurs);
  return a && a.texte && a.href ? a : null;
};

/* ------------------------------------------------------------- affichage */

const el = (balise, classe, texte) => {
  const n = document.createElement(balise);
  if (classe) n.className = classe;
  if (texte !== undefined) n.textContent = texte;
  return n;
};

/**
 * Monte le bandeau dans l'élément qui l'attend.
 *
 * Construit pièce par pièce plutôt qu'en assemblant du HTML : les libellés
 * viennent d'un fichier que l'on édite à la main, et une apostrophe typée de
 * travers ne doit pas pouvoir devenir du balisage.
 */
function poserMenu(hote, menu, chemin) {
  if (!hote) return null;
  const m = menu && Array.isArray(menu.liens) && menu.liens.length ? menu : MENU_DEFAUT;
  const entrees = entreesMenu(m, chemin);
  const marque = m.marque || MENU_DEFAUT.marque;

  const dedans = el('div', 'dedans');

  const mot = el('a', 'mot');
  mot.href = marque.href || '/';
  mot.append(el('b', null, marque.court || ''), el('i'), el('span', null, marque.long || ''));
  dedans.append(mot);

  const pages = el('ul', 'pages');
  for (const e of entrees) {
    const li = el('li');
    if (e.courant) {
      /*
       * La page ouverte ne se relie pas à elle-même. Sur la page d'estimation,
       * un clic distrait sur son propre nom rechargerait la page et effacerait
       * les réponses et les photos déjà saisies.
       */
      const ici = el('span', 'courant', e.texte);
      ici.setAttribute('aria-current', 'page');
      li.append(ici);
    } else {
      const a = el('a', null, e.texte);
      a.href = e.href;
      li.append(a);
    }
    pages.append(li);
  }
  dedans.append(pages);

  const ailleurs = lienAilleurs(m);
  if (ailleurs) {
    const a = el('a', 'ailleurs', ailleurs.texte);
    a.href = ailleurs.href;
    a.rel = 'noopener';
    dedans.append(a);
  }

  hote.replaceChildren(dedans);
  hote.hidden = false;
  return entrees;
}

/**
 * Va chercher `menu.json`, un cran au-dessus des deux pages.
 *
 * Un seul fichier pour /outils/etude/ et /outils/devis/ : un menu que l'on
 * modifierait à deux endroits finirait par différer d'une page à l'autre.
 *
 * Collée dans une page existante, la page n'en veut pas : le site qui
 * l'accueille porte déjà son propre menu.
 */
async function chargerMenu() {
  if (globalThis.__ngsMenu) return globalThis.__ngsMenu;
  if (globalThis.__ngsIntegre || globalThis.location?.protocol === 'file:') return null;
  try {
    const r = await fetch('../menu.json', { cache: 'no-store' });
    if (r.ok) return await r.json();
  } catch {
    // Absent : le menu par défaut fait l'affaire.
  }
  return null;
}

/**
 * Calculs optiques pour l'analyse de vue d'angle.
 *
 * Module pur (aucune dépendance au DOM) : utilisable dans le navigateur
 * et dans les tests Node.
 */

/** Formats de capteurs courants en vidéosurveillance IP (zone utile 16/9, en mm). */
const CAPTEURS = {
  '1/4"': { largeur: 3.6, hauteur: 2.03 },
  '1/3.6"': { largeur: 4.0, hauteur: 2.25 },
  '1/3"': { largeur: 4.8, hauteur: 2.7 },
  '1/2.9"': { largeur: 5.02, hauteur: 2.82 },
  '1/2.8"': { largeur: 5.18, hauteur: 2.92 },
  '1/2.7"': { largeur: 5.37, hauteur: 3.02 },
  '1/2.5"': { largeur: 5.76, hauteur: 3.24 },
  '1/2.3"': { largeur: 6.17, hauteur: 3.47 },
  '1/2"': { largeur: 6.4, hauteur: 3.6 },
  '1/1.8"': { largeur: 7.18, hauteur: 4.04 },
  '1/1.7"': { largeur: 7.6, hauteur: 4.28 },
  '1/1.2"': { largeur: 10.67, hauteur: 6.0 },
  '2/3"': { largeur: 8.8, hauteur: 4.95 },
  '1"': { largeur: 12.8, hauteur: 7.2 },

  /*
   * Capteurs thermiques. Un microbolomètre ne se désigne pas en pouces mais par
   * sa matrice et son pas de pixel : 256 × 192 au pas de 12 µm mesure
   * 3,07 × 2,30 mm. Choisir un format visible pour une caméra thermique
   * fausserait complètement l'angle de champ, et donc toute la mesure d'écart.
   */
  'Thermique 256×192 — 12 µm': { largeur: 3.072, hauteur: 2.304 },
  'Thermique 256×192 — 17 µm': { largeur: 4.352, hauteur: 3.264 },
  'Thermique 384×288 — 12 µm': { largeur: 4.608, hauteur: 3.456 },
  'Thermique 384×288 — 17 µm': { largeur: 6.528, hauteur: 4.896 },
  'Thermique 640×512 — 12 µm': { largeur: 7.68, hauteur: 6.144 },
  'Thermique 640×480 — 17 µm': { largeur: 10.88, hauteur: 8.16 },
};

/** Seuils DORI de la norme EN 62676-4, en pixels par mètre. */
const SEUILS_DORI = {
  detection: { label: 'Détection', ppm: 25 },
  observation: { label: 'Observation', ppm: 62 },
  reconnaissance: { label: 'Reconnaissance', ppm: 125 },
  identification: { label: 'Identification', ppm: 250 },
};

const degres = (radians) => (radians * 180) / Math.PI;
const radians = (degres_) => (degres_ * Math.PI) / 180;

/**
 * Angle de champ d'un objectif rectilinéaire.
 * @param {number} dimensionCapteur dimension du capteur en mm (largeur ou hauteur)
 * @param {number} focale focale en mm
 * @returns {number} angle de champ en degrés
 */
function angleDeChamp(dimensionCapteur, focale) {
  if (!(focale > 0) || !(dimensionCapteur > 0)) return 0;
  return degres(2 * Math.atan(dimensionCapteur / (2 * focale)));
}

/**
 * Angles de champ horizontal, vertical et diagonal.
 * @param {{largeur:number, hauteur:number}} capteur dimensions en mm
 * @param {number} focale en mm
 */
function anglesDeChamp(capteur, focale) {
  const diagonale = Math.hypot(capteur.largeur, capteur.hauteur);
  return {
    horizontal: angleDeChamp(capteur.largeur, focale),
    vertical: angleDeChamp(capteur.hauteur, focale),
    diagonal: angleDeChamp(diagonale, focale),
  };
}

/**
 * Largeur (ou hauteur) de scène couverte à une distance donnée.
 * @param {number} angleDeg angle de champ en degrés
 * @param {number} distance en mètres
 * @returns {number} largeur couverte en mètres
 */
function couverture(angleDeg, distance) {
  if (!(distance > 0)) return 0;
  return 2 * distance * Math.tan(radians(angleDeg) / 2);
}

/**
 * Focale nécessaire pour couvrir une largeur donnée à une distance donnée.
 * @param {number} largeurCapteur en mm
 * @param {number} largeurCible en mètres
 * @param {number} distance en mètres
 * @returns {number} focale en mm
 */
function focaleRequise(largeurCapteur, largeurCible, distance) {
  if (!(largeurCible > 0) || !(distance > 0)) return 0;
  return (largeurCapteur * distance) / largeurCible;
}

/**
 * Densité de pixels sur la scène, en pixels par mètre.
 * @param {number} resolutionH résolution horizontale en pixels
 * @param {number} angleHDeg angle de champ horizontal en degrés
 * @param {number} distance en mètres
 */
function pixelsParMetre(resolutionH, angleHDeg, distance) {
  const largeur = couverture(angleHDeg, distance);
  if (!(largeur > 0)) return 0;
  return resolutionH / largeur;
}

/**
 * Distance maximale à laquelle un critère DORI est encore tenu.
 * @param {number} resolutionH résolution horizontale en pixels
 * @param {number} angleHDeg angle de champ horizontal en degrés
 * @param {number} ppmRequis pixels par mètre exigés
 * @returns {number} distance en mètres
 */
function distanceDori(resolutionH, angleHDeg, ppmRequis) {
  if (!(ppmRequis > 0) || !(angleHDeg > 0)) return 0;
  const largeurMax = resolutionH / ppmRequis;
  return largeurMax / (2 * Math.tan(radians(angleHDeg) / 2));
}

/** Tableau complet des distances DORI pour une configuration donnée. */
function tableauDori(resolutionH, angleHDeg) {
  return Object.entries(SEUILS_DORI).map(([cle, { label, ppm }]) => ({
    cle,
    label,
    ppm,
    distance: distanceDori(resolutionH, angleHDeg, ppm),
  }));
}

/** Niveau DORI atteint pour une densité de pixels donnée. */
function niveauDori(ppm) {
  if (ppm >= SEUILS_DORI.identification.ppm) return 'identification';
  if (ppm >= SEUILS_DORI.reconnaissance.ppm) return 'reconnaissance';
  if (ppm >= SEUILS_DORI.observation.ppm) return 'observation';
  if (ppm >= SEUILS_DORI.detection.ppm) return 'detection';
  return 'insuffisant';
}

/**
 * Convertit un décalage exprimé en fraction de la largeur d'image
 * en écart angulaire, en tenant compte de la projection rectilinéaire.
 *
 * Un décalage de 50 % de la largeur correspond exactement à un demi-angle
 * de champ ; la relation n'est pas linéaire entre les deux.
 *
 * @param {number} fraction décalage / largeur d'image (0.1 = 10 % de l'image)
 * @param {number} angleDeg angle de champ sur cet axe, en degrés
 * @returns {number} écart angulaire en degrés
 */
function fractionVersAngle(fraction, angleDeg) {
  if (!(angleDeg > 0)) return 0;
  return degres(Math.atan(2 * fraction * Math.tan(radians(angleDeg) / 2)));
}

/**
 * Hauteur de montage et angle de site (inclinaison) à partir de la
 * distance au point visé.
 * @param {number} hauteur hauteur de la caméra en mètres
 * @param {number} distanceSol distance horizontale au point visé, en mètres
 * @param {number} hauteurCible hauteur du point visé (0 = au sol)
 * @returns {number} angle d'inclinaison sous l'horizontale, en degrés
 */
function angleInclinaison(hauteur, distanceSol, hauteurCible = 0) {
  if (!(distanceSol > 0)) return 90;
  return degres(Math.atan((hauteur - hauteurCible) / distanceSol));
}

/** Zone morte au pied du mât : distance à partir de laquelle le sol entre dans le champ. */
function zoneMorte(hauteur, inclinaisonDeg, angleVDeg) {
  const bordBas = inclinaisonDeg + angleVDeg / 2;
  if (bordBas >= 90) return 0;
  if (bordBas <= 0) return Infinity;
  return hauteur / Math.tan(radians(bordBas));
}

/* ===== prix.js ===== */
/**
 * Chiffrage : prix du matériel, main-d'œuvre, devis.
 *
 * Un prix n'a de valeur que daté et sourcé. Trois provenances cohabitent, et
 * elles ne se valent pas :
 *
 * - **vendu** : un prix que l'agence a réellement pratiqué, tiré de ses ventes ;
 * - **relevé** : un prix vu chez un revendeur, un jour donné, qui aura bougé ;
 * - **saisi** : un prix entré à la main, sous la responsabilité de l'agence.
 *
 * Le devis dit toujours de laquelle il tient chaque ligne. Un prix relevé il y a
 * six mois et présenté comme ferme engage l'agence sur une marge qui n'existe
 * plus.
 *
 * Module pur (aucune dépendance au DOM), testé sous Node.
 */


/** Taux normal de TVA en France. */
const TVA_DEFAUT = 0.2;

/** Marge commerciale appliquée par défaut au matériel. */
const MARGE_COMMERCIALE = 0.25;

/** Provenances d'un prix, de la plus sûre à la moins. */
const PROVENANCES = {
  vendu: { label: 'Prix pratiqué', marque: '✓' },
  saisi: { label: 'Saisi par l\'agence', marque: '✓' },
  releve: { label: 'Relevé chez un revendeur', marque: '~' },
  aucune: { label: 'Prix à renseigner', marque: '⋯' },
};

/**
 * Un nombre, jamais NaN, lu à la française.
 *
 * Les montants d'un export comptable arrivent écrits pour être lus :
 * « 2 056,00 € », avec un séparateur de milliers qui peut être une espace
 * ordinaire, insécable ou fine. `parseFloat` s'arrête au premier espace et lit
 * 2 au lieu de 2 056 — une erreur d'un facteur mille, silencieuse.
 */
const montant = (v, defaut = 0) => {
  const t = String(v ?? '')
    .replace(/[\s\u00a0\u202f]/g, '')
    .replace(/[€$£]/g, '')
    .replace(',', '.');
  const n = parseFloat(t);
  return Number.isFinite(n) ? n : defaut;
};

/** Prix hors taxes à partir d'un prix toutes taxes comprises. */
const htDepuisTtc = (ttc, tva = TVA_DEFAUT) => (tva > -1 ? ttc / (1 + tva) : ttc);

/** Et l'inverse. */
const ttcDepuisHt = (ht, tva = TVA_DEFAUT) => ht * (1 + tva);

/**
 * Prix unitaire tiré d'un relevé de ventes.
 *
 * Les rapports de place de marché donnent un chiffre d'affaires et un nombre
 * d'unités : leur quotient est le prix réellement pratiqué. Sur une place de
 * marché grand public il est **toutes taxes comprises**, ce que l'appelant doit
 * savoir pour le ramener hors taxes avant de l'inscrire à un devis.
 *
 * @returns {number|null} prix unitaire, `null` si le quotient n'a pas de sens
 */
function prixDepuisVentes(ventes, unites) {
  const ca = montant(ventes);
  const n = montant(unites);
  if (!(ca > 0) || !(n > 0)) return null;
  return ca / n;
}

/**
 * Prix d'un article, ramené hors taxes.
 *
 * `champ` vaut `prixAchat` ou `prixVente` : ce que l'agence paie, ou ce
 * qu'elle facture. **Les confondre fausse la marge dans un sens ou dans
 * l'autre** — un prix de vente relevé dans ses propres ventes, repris comme
 * prix d'achat, se verrait appliquer une marge qu'il contient déjà.
 *
 * @param {object} article
 * @param {string} [champ='prixAchat']
 * @param {number} [tvaDefaut]
 * @returns {number} prix hors taxes, 0 si ce prix-là n'est pas connu
 */
function prixHt(article, champ = 'prixAchat', tvaDefaut = TVA_DEFAUT) {
  const p = montant(article?.[champ]);
  if (!(p > 0)) return 0;
  const ttc = champ === 'prixVente' ? article.venteTtc : article.achatTtc;
  return ttc ? htDepuisTtc(p, montant(article.tva, tvaDefaut)) : p;
}

/**
 * Provenance du prix retenu pour un article.
 *
 * Le prix de vente l'emporte quand il existe : c'est celui que l'agence
 * pratique, et il n'a pas à être recalculé depuis un coût d'achat.
 */
function provenancePrix(article) {
  const vente = montant(article?.prixVente);
  const achat = montant(article?.prixAchat);
  if (!(vente > 0) && !(achat > 0)) return 'aucune';
  const source = vente > 0 ? article.sourceVente : article.sourceAchat;
  const p = source?.type;
  return PROVENANCES[p] ? p : 'saisi';
}

/**
 * Une ligne de devis.
 *
 * @param {object} article référence du catalogue, prix compris
 * @param {number} quantite
 * @param {object} [options]
 * @param {number} [options.marge] marge appliquée au prix d'achat
 * @param {number} [options.tva]
 */
function ligne(article, quantite, options = {}) {
  const marge = options.marge ?? MARGE_COMMERCIALE;
  const achat = prixHt(article, 'prixAchat', options.tva);
  const venteSaisie = prixHt(article, 'prixVente', options.tva);
  // Un prix de vente connu s'impose ; sinon la marge le construit sur l'achat.
  const vente = venteSaisie > 0 ? venteSaisie : achat * (1 + marge);
  const q = Math.max(0, montant(quantite));
  return {
    article,
    quantite: q,
    achatHt: achat,
    venteHt: vente,
    totalHt: vente * q,
    // Une marge n'a de sens que si l'on connaît le coût d'achat.
    margeReelle: achat > 0 ? (vente - achat) / achat : null,
    provenance: provenancePrix(article),
  };
}

/**
 * Devis complet.
 *
 * @param {object[]} lignes issues de `ligne()`
 * @param {object} [reglages]
 * @param {number} [reglages.heures] main-d'œuvre, en heures
 * @param {number} [reglages.tauxHoraire] en euros hors taxes
 * @param {number} [reglages.remise] part retirée du total matériel
 * @param {number} [reglages.tva]
 */
function devis(lignes, reglages = {}) {
  const tva = reglages.tva ?? TVA_DEFAUT;
  const remise = Math.min(1, Math.max(0, montant(reglages.remise)));

  const materielBrut = (lignes || []).reduce((s, l) => s + l.totalHt, 0);
  const montantRemise = materielBrut * remise;
  const materielHt = materielBrut - montantRemise;
  const mainOeuvreHt = Math.max(0, montant(reglages.heures))
    * Math.max(0, montant(reglages.tauxHoraire));

  const totalHt = materielHt + mainOeuvreHt;
  const montantTva = totalHt * tva;

  // Ce qui manque pour que le devis soit complet : une ligne sans prix n'est
  // pas une ligne à zéro euro, c'est une ligne qu'on a oublié de chiffrer.
  const sansPrix = (lignes || []).filter((l) => l.provenance === 'aucune');
  const releves = (lignes || []).filter((l) => l.provenance === 'releve');

  return {
    lignes: lignes || [],
    materielBrut,
    remise,
    montantRemise,
    materielHt,
    mainOeuvreHt,
    totalHt,
    tva,
    montantTva,
    totalTtc: totalHt + montantTva,
    sansPrix,
    releves,
    complet: sansPrix.length === 0,
  };
}

/**
 * Réserves à joindre au devis — vides quand tout est sourcé et chiffré.
 */
function reservesDevis(d) {
  const reserves = [];
  if (d.sansPrix.length) {
    reserves.push(`${d.sansPrix.length} ligne${d.sansPrix.length > 1 ? 's' : ''} sans prix : `
      + `${d.sansPrix.map((l) => l.article.reference || l.article.nom || '?').join(', ')}. `
      + 'Le total ci-dessous est donc incomplet.');
  }
  if (d.releves.length) {
    const dates = [...new Set(d.releves
      .map((l) => (l.article.sourceVente || l.article.sourceAchat)?.date)
      .filter(Boolean))];
    reserves.push(`${d.releves.length} prix relevé${d.releves.length > 1 ? 's' : ''} chez un `
      + `revendeur${dates.length ? ` (${dates.join(', ')})` : ''} : à confirmer auprès du `
      + 'distributeur avant engagement — un tarif bouge.');
  }
  return reserves;
}

/**
 * Un montant s'écrit « 1 590,50 € ».
 *
 * Deux décimales toujours, la seconde fût-elle un zéro, et un séparateur de
 * milliers insécable. « 1590,5 € » sur un devis se lit comme une saisie
 * inachevée, et « 12345,67 € » se compte du doigt.
 */
const euros = (v) => {
  const n = arrondir(Number(v) || 0, 2);
  const [entier, decimales] = Math.abs(n).toFixed(2).split('.');
  const groupe = entier.replace(/\d(?=(\d{3})+$)/g, '$&\u202f');
  return `${n < 0 ? '-' : ''}${groupe},${decimales} €`;
};

/* ===== boutique.js ===== */
/**
 * Catalogue de la boutique, traduit en langage d'acheteur.
 *
 * Un particulier ne sait pas ce qu'est une focale de 4 mm ni un capteur
 * 1/2.8". Il sait en revanche très bien ce qu'il veut : « voir qui sonne à ma
 * porte », « surveiller le fond du jardin ». Ce module fait la traduction,
 * avec les mêmes fonctions optiques que l'outil d'étude — pas une règle de
 * trois écrite pour la vitrine.
 *
 * Règle intangible : **rien n'est inventé**. Une caméra sans optique
 * renseignée est présentée sans chiffres plutôt qu'avec des chiffres
 * plausibles.
 *
 * Module pur (aucune dépendance au DOM), testé sous Node.
 */


/**
 * Capteur retenu faute de mieux.
 *
 * C'est le format courant des caméras IP 4K de vidéosurveillance. Il est
 * *supposé* : `estSuppose` le dit, et la page l'écrit au visiteur.
 */
const CAPTEUR_DEFAUT = '1/2.8"';

/** Distance de référence pour annoncer une largeur de champ, en mètres. */
const DISTANCE_VITRINE = 10;

/**
 * Plafond de portée, faute de mieux : 150 m.
 *
 * L'optique seule mène à des chiffres que le terrain dément. Un 25× annonce
 * une reconnaissance à 677 m si l'on ne regarde que les pixels ; de nuit
 * l'infrarouge s'arrête à 200 m, et de jour la brume et la turbulence de
 * l'air font le reste. Hikvision plafonne ce même modèle à 409 m dans sa
 * propre table. Imprimer 677 m sur une page client serait indéfendable.
 *
 * `porteeMax` sur la fiche produit — la portée de l'éclairage, en général —
 * remplace ce plafond dès qu'elle est connue.
 */
const PLAFOND_DEFAUT = 150;

/** Ce que chaque niveau permet, dit à un particulier. */
const USAGES = {
  detection: 'voir qu\'il se passe quelque chose',
  observation: 'suivre ce qui se passe',
  reconnaissance: 'reconnaître quelqu\'un que vous connaissez',
  identification: 'identifier une personne inconnue',
};

/** Un nombre utilisable, ou 0. */
const nombre = (v) => (Number.isFinite(Number(v)) && Number(v) > 0 ? Number(v) : 0);

/**
 * Les deux focales d'un produit : bornes d'un zoom, ou deux fois la même pour
 * un objectif fixe.
 * @returns {{min:number, max:number}|null} null si aucune focale n'est connue
 */
function focales(produit) {
  const min = nombre(produit?.focaleMin) || nombre(produit?.focale);
  const max = nombre(produit?.focaleMax) || nombre(produit?.focale) || min;
  if (!min) return null;
  return { min, max: Math.max(min, max) };
}

/**
 * Ce qu'un produit permet de voir.
 *
 * L'angle de champ vient du constructeur dès qu'il est renseigné, et c'est
 * toujours préférable : un grand-angle n'est pas rectiligne. Dahua annonce
 * 95° pour son 2,8 mm quand le calcul en donne 83, Axis 130° pour un 2,4 mm
 * quand le calcul en donne 98. Calculer à sa place resserrerait le champ sur
 * le papier, donc gonflerait les pixels par mètre — et la caméra posée au mur
 * démentirait la page.
 *
 * Faute d'angle déclaré, il est calculé depuis la focale et le capteur, et
 * `angleCalcule` le dit.
 *
 * @returns {object|null} null tant que la définition, et soit l'angle soit la
 *   focale, ne sont pas connues — auquel cas la page n'annonce aucun chiffre.
 */
function capacites(produit) {
  const resH = nombre(produit?.resH);
  if (!resH) return null;

  const f = focales(produit);
  const declareLarge = nombre(produit?.angleH);
  const declareSerre = nombre(produit?.angleHTele);
  if (!declareLarge && !f) return null;

  const nomCapteur = produit.capteur && CAPTEURS[produit.capteur]
    ? produit.capteur : CAPTEUR_DEFAUT;
  const capteur = CAPTEURS[nomCapteur];
  const calcule = (focale) => anglesDeChamp(capteur, focale).horizontal;
  const plafond = nombre(produit?.porteeMax) || PLAFOND_DEFAUT;

  // Au grand angle pour la largeur embrassée, au téléobjectif pour la portée :
  // c'est ainsi que le produit sera réglé selon ce qu'on lui demande.
  const angleLarge = declareLarge || calcule(f.min);
  // Le téléobjectif : l'angle déclaré s'il existe, sinon le calcul sur la
  // focale longue, sinon l'objectif est fixe et le champ ne bouge pas.
  const angleSerre = declareSerre
    || (f && f.max > f.min ? calcule(f.max) : angleLarge);

  const optiques = Object.fromEntries(Object.keys(SEUILS_DORI).map((cle) => [
    cle, distanceDori(resH, angleSerre, SEUILS_DORI[cle].ppm),
  ]));

  return {
    reglable: angleSerre < angleLarge - 0.5,
    focaleMin: f ? f.min : null,
    focaleMax: f ? f.max : null,
    capteur: nomCapteur,
    // L'angle vient-il du constructeur, ou d'un calcul sur un capteur supposé ?
    angleCalcule: !declareLarge,
    estSuppose: !declareLarge && (!produit.capteur || !CAPTEURS[produit.capteur]),
    angleLarge,
    angleSerre,
    largeurA: (d = DISTANCE_VITRINE) => couverture(angleLarge, d),
    // Le zoom annoncé par le constructeur prime : un 2,8–12 mm fait 4,29× au
    // calcul, et Hikvision l'appelle un ×4. Autant parler comme la fiche.
    zoom: nombre(produit?.zoom) || (f && f.max > f.min ? f.max / f.min : 1),
    ptz: produit.type === 'ptz',
    plafond,
    // Ce que l'optique permet, et ce que le terrain tient vraiment.
    portees: optiques,
    porteesTenues: Object.fromEntries(Object.entries(optiques)
      .map(([cle, d]) => [cle, Math.min(d, plafond)])),
    /*
     * Vrai seulement si un chiffre RÉELLEMENT AFFICHÉ a été rabattu. Se fier
     * à la détection — qui porte toujours le plus loin — ferait apparaître
     * l'avertissement sous des fiches dont aucune distance annoncée n'a
     * bougé.
     */
    plafonne: optiques.reconnaissance > plafond,
  };
}

/**
 * Phrase de vitrine : ce que cette caméra permet de faire, et jusqu'où.
 *
 * On annonce la reconnaissance plutôt que l'identification : c'est le niveau
 * qu'un client attend d'une caméra d'extérieur, et le promettre à la distance
 * d'identification reviendrait à vendre deux fois moins de portée qu'annoncé.
 */
function argumentaire(produit) {
  const c = capacites(produit);
  if (!c) return null;
  const largeur = c.largeurA(DISTANCE_VITRINE);
  const optique = optiqueEnClair(c);
  return {
    optique,
    largeur,
    // Deux repères concrets : ce qu'on embrasse de large, et jusqu'où on
    // reconnaît une tête connue. Les portées sont celles que le terrain
    // tient, pas celles que l'optique promet.
    champ: `${optique} — ${arr(largeur)} m de large à ${DISTANCE_VITRINE} m`,
    reconnaissance: c.porteesTenues.reconnaissance,
    identification: c.porteesTenues.identification,
    plafonne: c.plafonne,
    plafond: c.plafond,
    ptz: c.ptz,
    zoom: c.zoom,
  };
}

/**
 * L'objectif, dit en clair.
 *
 * La focale parle au professionnel ; l'angle parle à tout le monde. On donne
 * les deux quand on a les deux, l'angle seul sinon.
 */
function optiqueEnClair(c) {
  if (c.ptz && c.zoom > 1.05) {
    // Sur une caméra mobile, le zoom parle plus que la focale : « ×25 » se
    // comprend, « 5,9 à 147,5 mm » demande un calcul.
    return `zoom ×${arr(c.zoom)}, de ${arr(c.angleLarge)} ° à ${arr(c.angleSerre)} °`;
  }
  if (!c.focaleMin) return `champ de ${arr(c.angleLarge)} °`;
  if (c.reglable && c.focaleMax > c.focaleMin) {
    return `objectif réglable de ${arr(c.focaleMin)} à ${arr(c.focaleMax)} mm`;
  }
  return `objectif ${arr(c.focaleMin)} mm, ${arr(c.angleLarge)} ° de champ`;
}

/** Arrondi à une décimale, sans zéro inutile : 4 et non 4,0. */
const arr = (v) => String(Math.round(v * 10) / 10).replace('.', ',');

/**
 * Produits retenus pour la page, dans l'ordre du fichier.
 *
 * Seule la référence est exigée : sans elle le visiteur n'aurait rien à
 * demander. L'adresse d'une fiche produit, elle, est facultative — sur
 * l'espace professionnel il n'y a pas de boutique derrière, et une fiche qui
 * annonce un champ et une portée renseigne même sans lien marchand.
 */
const produitsAffichables = (catalogue) => (catalogue?.produits || [])
  .filter((p) => p && typeof p.reference === 'string' && p.reference.trim());

/**
 * Réserves à afficher sous le catalogue.
 *
 * Un fichier vide n'est pas une erreur : c'est un catalogue pas encore
 * rempli. Le dire vaut mieux que montrer une grille vide sans explication.
 */
function reservesCatalogue(catalogue) {
  const reserves = [];
  const bruts = catalogue?.produits || [];
  const affichables = produitsAffichables(catalogue);

  if (!bruts.length) {
    reserves.push('Aucun produit n\'est encore inscrit à cette page.');
  } else if (affichables.length < bruts.length) {
    const n = bruts.length - affichables.length;
    reserves.push(`${n} produit${n > 1 ? 's' : ''} sans référence : non affiché, `
      + 'faute de quoi le visiteur ne saurait pas quoi demander.');
  }

  const sansOptique = affichables.filter((p) => !capacites(p));
  if (sansOptique.length) {
    reserves.push(`${sansOptique.length} produit${sansOptique.length > 1 ? 's' : ''} sans `
      + 'optique renseignée : présenté sans portée annoncée. '
      + 'Renseignez resH, puis angleH (l\'angle du constructeur) ou à défaut '
      + 'focale, pour que la page les calcule.');
  }
  return reserves;
}

/* ===== presentation.js ===== */
/**
 * Page de présentation : comprendre avant de chiffrer.
 *
 * Elle ne calcule pas d'installation — c'est le rôle de la page d'étude. Elle
 * explique ce que l'outil fait, montre ce qu'une caméra permet vraiment de
 * voir, et renvoie vers les deux : l'étude et les caméras.
 *
 * Les deux destinations sont réglables dans `catalogue.json`. Par défaut elles
 * restent sur le site qui sert la page : rien à éditer quand tout tient sur un
 * seul domaine.
 *
 * Les chiffres de l'échelle et des fiches produits sortent des mêmes fonctions
 * optiques que l'outil d'étude. Une vitrine qui annonce d'autres portées que
 * l'étude est une vitrine qui ment à moitié.
 */





// Le même formatage de montant que le devis : « 289,90 € », jamais « 289,9 € ».


/**
 * Adresses par défaut, relatives à la racine du site.
 *
 * Relatives, et non ancrées à la racine : les deux pages se trouvent ainsi
 * qu'elles soient sur le domaine, sous un sous-dossier d'hébergement de
 * pages, ou dans un cadre. `catalogue.json` — posé à côté de la page et relu
 * à chaque ouverture — porte les adresses complètes quand il le faut.
 */
const OUTIL = '../devis/';
const BOUTIQUE = '/';

/** Catalogue de secours, embarqué à la fabrication. */
const CATALOGUE_EMBARQUE = globalThis.__catalogue || null;

/**
 * Caméra servant d'exemple à l'échelle des paliers.
 *
 * C'est une caméra réelle, avec son champ annoncé par Hikvision : le
 * DS-2CD2T86G2-4I, le 4 K AcuSense le plus courant. L'illustration figure
 * au-dessus des fiches produits, et un exemple calculé sur un capteur
 * supposé y annoncerait d'autres distances que la fiche du même modèle,
 * trois centimètres plus bas.
 */
const EXEMPLE = {
  reference: 'Hikvision DS-2CD2T86G2-4I', modele: '4 K AcuSense à objectif 4 mm',
  resH: 3840, capteur: '1/1.8"', focale: 4, angleH: 87,
};

const ech = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[c]));

/** Charge le catalogue posé à côté de la page, sinon celui embarqué. */
async function chargerCatalogue() {
  // Depuis le disque, `fetch` est refusé et le refus s'inscrit dans la console
  // quoi qu'on l'attrape : sur une page publique, autant aller droit au but.
  // Collée dans une page existante, la page porte ses données avec elle :
  // aller les chercher à côté d'elle réclamerait un fichier qui n'y est pas,
  // et laisserait une erreur rouge dans la console du visiteur.
  if (!globalThis.__ngsIntegre && window.location.protocol !== 'file:') {
    try {
      const r = await fetch('catalogue.json', { cache: 'no-store' });
      if (r.ok) return await r.json();
    } catch {
      // Fichier absent : le catalogue embarqué fera l'affaire.
    }
  }
  return CATALOGUE_EMBARQUE;
}

/* --------------------------------------------------------- échelle DORI */

/**
 * L'échelle des quatre paliers, dessinée à l'échelle des distances.
 *
 * Une barre par palier, longue comme la distance à laquelle il tient encore.
 * Le rapport entre « repérer » et « identifier » — un facteur dix — se voit
 * alors d'un coup d'œil, là où un tableau de chiffres se lit.
 */
function dessinerEchelle() {
  const c = capacites(EXEMPLE);
  const ordre = ['detection', 'observation', 'reconnaissance', 'identification'];
  const max = c.portees.detection;

  const L = 720;
  const hauteurLigne = 46;
  // De quoi loger « reconnaître quelqu'un que vous connaissez » sans que la
  // légende ne passe sous sa propre barre.
  const marge = 230;
  const H = ordre.length * hauteurLigne + 26;

  const barres = ordre.map((cle, i) => {
    const d = c.portees[cle];
    const y = i * hauteurLigne + 16;
    const l = Math.max(2, ((L - marge - 64) * d) / max);
    return `<g>
      <text x="0" y="${y + 15}" font-size="13" font-weight="600" fill="#1a1d23"
        >${ech(SEUILS_DORI[cle].label)}</text>
      <text x="0" y="${y + 31}" font-size="11" fill="#5b6472"
        >${ech(USAGES[cle])}</text>
      <rect x="${marge}" y="${y + 4}" width="${l}" height="20" rx="4"
        fill="${['#8a9099', '#5b6472', '#9d0c24', '#c8102e'][i]}"/>
      <text x="${marge + l + 8}" y="${y + 19}" font-size="13" font-weight="600"
        fill="#1a1d23">${ech(fr(d))} m</text>
    </g>`;
  }).join('');

  $('#schema-dori').innerHTML = `<svg viewBox="0 0 ${L} ${H}" role="img"
    aria-label="Distances auxquelles chaque palier est encore tenu">
    ${barres}
  </svg>`;

  const a = argumentaire(EXEMPLE);
  $('#legende-dori').textContent = `Distances pour un ${EXEMPLE.modele} `
    + `(${EXEMPLE.reference}), le plus courant — il embrasse `
    + `${fr(a.largeur)} m de large à ${DISTANCE_VITRINE} m. Une caméra plus `
    + 'ouverte voit plus large mais moins loin ; une caméra plus serrée, '
    + 'l\'inverse. C\'est tout le travail de l\'étude que de trancher.';
}

/* ------------------------------------------------------------ produits */

/**
 * Ce que la caméra permet, et jusqu'où.
 *
 * Trois cas, et non un seul : un objectif qui ne zoome pas ne se règle pas
 * « au maximum » ; et quand l'éclairage s'arrête avant que les pixels ne
 * manquent, répéter deux fois la même distance donnerait l'air d'une panne.
 */
function portee(a) {
  const ou = a.ptz && a.zoom > 1.05 ? 'Au zoom maximal, l' : 'L';
  if (a.reconnaissance >= a.plafond - 0.05) {
    return `${ou}'image reste exploitable pour identifier quelqu'un sur toute
      la portée de son éclairage, <b>${ech(fr(a.plafond, 0))} m</b>. Au-delà,
      ce sont l'éclairage et l'air qui décident, plus les pixels.`;
  }
  return `${ou}a caméra reconnaît une personne jusqu'à
    <b>${ech(fr(a.reconnaissance))} m</b>, et identifie un inconnu jusqu'à
    <b>${ech(fr(a.identification))} m</b>.`;
}

/** Les vignettes produits, ou le mot qui explique leur absence. */
function afficherProduits(catalogue) {
  const boutique = destination('__ngsBoutique', catalogue?.boutique, BOUTIQUE);
  const produits = produitsAffichables(catalogue);

  $('#intro-produits').textContent = produits.length
    ? 'Les portées ci-dessous sont calculées sur l\'optique de chaque modèle, '
      + 'pas relevées sur une fiche commerciale.'
    : 'La sélection est en cours de constitution.';

  $('#produits').innerHTML = produits.map((p) => {
    const a = argumentaire(p);
    const c = capacites(p);
    // Une fiche sans adresse reste une fiche : elle informe, elle ne mène
    // nulle part. Un lien vide, lui, déçoit le clic.
    const [ouvre, ferme] = p.url
      ? [`<a class="produit" href="${ech(p.url)}">`, '</a>']
      : ['<div class="produit sans-lien">', '</div>'];
    return `${ouvre}
      ${p.image ? `<img src="${ech(p.image)}" alt="" loading="lazy">` : ''}
      <span class="nom">${ech(p.reference)}</span>
      ${a ? `<span class="optique">${ech(a.champ)}</span>
        <span class="portee">${portee(a)}${c.estSuppose ? '*' : ''}</span>
        ${a.ptz ? `<span class="note-fiche">Caméra mobile : elle ne regarde
          qu'une direction à la fois.</span>` : ''}`
    : '<span class="optique">Caractéristiques optiques sur la fiche produit.</span>'}
      ${p.prixTtc > 0 ? `<span class="prix">${ech(euros(p.prixTtc))} TTC</span>` : ''}
    ${ferme}`;
  }).join('');

  const reserves = reservesCatalogue(catalogue);
  const suppose = produits.some((p) => capacites(p)?.estSuppose);
  if (suppose) {
    reserves.push('* Portées calculées en supposant un capteur 1/2.8", format '
      + 'courant de ces caméras. La fiche produit fait foi.');
  }
  $('#reserves-produits').innerHTML = reserves
    .map((r) => `<li>${ech(r)}</li>`).join('');

  for (const id of ['#lien-boutique']) $(id).href = boutique;
  // Libellés neutres : ils conviennent que les deux pages soient sur un seul
  // site ou sur deux domaines.
  $('#pied-liens').innerHTML = `<a href="${ech(boutique)}">Nos caméras</a>
    · <a href="${ech(destination('__ngsOutil', catalogue?.outil, OUTIL))}"
      >Estimer mon installation</a>`;
}

/* ------------------------------------------------------------ démarrage */

/**
 * Les deux destinations, par ordre de priorité.
 *
 * Un bloc collé dans un site porte son catalogue sur une seule ligne, longue
 * de dizaines de milliers de caractères : y retrouver une adresse relève de
 * l'exploit. Le bloc les redéclare donc en clair, en tête, et ce sont
 * celles-là qui gagnent.
 */
const destination = (cle, depuisCatalogue, defaut) => (
  globalThis[cle] || depuisCatalogue || defaut
);

async function demarrer() {
  // Le menu d'abord, et sans l'attendre : il ne dépend pas du catalogue, et
  // une page qui n'afficherait ses portes de sortie qu'une fois les produits
  // chargés laisserait le visiteur devant un mur le temps du chargement.
  chargerMenu().then((m) => poserMenu($('#site-menu'), m, globalThis.location?.pathname));

  const catalogue = await chargerCatalogue();
  const outil = destination('__ngsOutil', catalogue?.outil, OUTIL);
  $$('#lien-outil, #lien-outil-bas').forEach((a) => { a.href = outil; });

  dessinerEchelle();
  afficherProduits(catalogue);
}

demarrer();

}());</script>
