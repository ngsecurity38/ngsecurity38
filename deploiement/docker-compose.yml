# Sert les deux pages d'outils depuis le VPS — NG Security 38.
#
#   docker compose -f deploiement/docker-compose.yml up -d
#
# Les pages sont des fichiers statiques : aucune base, aucun PHP, rien à
# sauvegarder. Mettre à jour se résume à « git pull » puis « restart ».
services:
  outils:
    image: nginx:alpine
    container_name: ngs-outils
    restart: unless-stopped
    # 8080 pour ne rien bousculer : le port 80 sert sans doute déjà quelque
    # chose. À placer derrière votre proxy, ou à changer ici.
    ports:
      - "8080:80"
    volumes:
      # En lecture seule : le conteneur n'a aucune raison d'écrire dans le
      # dépôt, et une image publique n'a pas à pouvoir le faire.
      - ../docs/outils:/usr/share/nginx/html/outils:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/outils/etude/"]
      interval: 30s
      timeout: 5s
      retries: 3
